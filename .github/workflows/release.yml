# Build the addon zip and publish it whenever a version tag (like v1.1.0) is pushed.
# Uploads to CurseForge (and Wago) once their keys are added as repository secrets
# and the TOC has ## X-Curse-Project-ID / ## X-Wago-ID lines.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
